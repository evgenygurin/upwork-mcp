services:
  worker:
    build: .
    container_name: upwork-mcp-worker
    restart: unless-stopped
    ports:
      - "47821:47821"
    environment:
      # Chrome CDP — connects to cdp-proxy running on host machine
      # Run: node cdp-proxy.js  (proxies port 9223 → Chrome 9222, fixes Host header)
      - CDP_HOST=host.docker.internal
      - CDP_PORT=9223
      - WORKER_PORT=47821

      # Upwork credentials
      - UPWORK_EMAIL=${UPWORK_EMAIL}
      - UPWORK_PASSWORD=${UPWORK_PASSWORD}

      # Freelancer profile
      - FREELANCER_NAME=${FREELANCER_NAME:-Freelancer}
      - FREELANCER_TITLE=${FREELANCER_TITLE:-n8n Workflow Automation Expert}
      - FREELANCER_NICHE=${FREELANCER_NICHE:-n8n,workflow automation}

      # Bidding defaults
      - BID_RATE_MIN=${BID_RATE_MIN:-25}
      - BID_RATE_MAX=${BID_RATE_MAX:-75}
      - BID_RATE_DEFAULT=${BID_RATE_DEFAULT:-45}

      # Session file path
      - SESSION_FILE=/app/sessions/upwork-session.json

    volumes:
      # Persist login session across restarts
      - upwork_sessions:/app/sessions

    extra_hosts:
      # Allow container to reach host machine (for Chrome CDP)
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:47821/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  upwork_sessions:
    driver: local
